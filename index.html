<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jornada Ext Laboral · Unispan</title>
<meta name="theme-color" content="#14246e">
<meta name="description" content="Jornada Ext Laboral · Registro, firmas y legalización de horas extras · Unispan">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jornada Ext Laboral">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icono-180.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0} img{max-width:100%} [hidden]{display:none!important}
/* Mismo diseño de la Bitácora de Herramientas */
:root{
  /* Colores: azul turquí, azul celeste y blanco */
  --bg:#eef5fb; --surface:#ffffff; --surface-2:#f3f8fc; --line:#d3e1ee;
  --fg:#0b1640; --fg-2:#3d4b6b; --steel:#14246e; --steel-fg:#ffffff;
  --yellow:#4cc3f0; --yellow-ink:#0b1640;
  --ok:#1d7a46; --ok-bg:#e1f3e8; --warn:#9a5b00; --warn-bg:#fdf0d6; --bad:#b4232c; --bad-bg:#fbe3e4; --info:#245a8f; --info-bg:#e2edf8;
  --vio:#5b3cc4; --vio-bg:#ece6fb;
  --shadow:0 10px 40px rgba(17,24,32,.18);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a1230; --surface:#111c44; --surface-2:#172452; --line:#253567;
  --fg:#eef4ff; --fg-2:#b5c3e3; --steel:#7fd0f3; --steel-fg:#0a1230;
  --yellow:#4cc3f0; --yellow-ink:#0a1230;
  --ok:#6fd39b; --ok-bg:#163525; --warn:#f4b955; --warn-bg:#3a2a0d; --bad:#ff8a90; --bad-bg:#43191d; --info:#8fc0f0; --info-bg:#172c43;
  --vio:#c3b2ff; --vio-bg:#2a2244;
  --shadow:0 10px 40px rgba(0,0,0,.5); color-scheme:dark}}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:17px}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.1}
.num{font-variant-numeric:tabular-nums}

/* ---------- Estructura ---------- */
.app{display:grid;grid-template-columns:1fr;min-height:100%}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav-brand{display:none}
.nav-sub{display:none}
@media (min-width:760px){.nav-sub{display:flex;flex-direction:column;gap:1px;padding:0 8px 6px;max-height:40vh;overflow:auto}
  .nav .nav-anio{min-height:0;flex-direction:row;justify-content:space-between;font-size:13px;font-weight:800;color:var(--fg-2);padding:6px 8px;border-radius:8px}
  .nav .nav-mes{min-height:0;flex-direction:row;justify-content:space-between;padding:5px 8px;font-size:13px;border-radius:8px;text-transform:capitalize}
  .nav .nav-mes small{font-weight:400;color:var(--fg-2)}
  .nav .nav-mes[aria-current="true"]{background:var(--yellow);color:var(--yellow-ink)}}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:9px 2px 8px;font-size:13px;font-weight:700;color:var(--fg-2);min-height:60px;cursor:pointer}
.nav button svg{width:26px;height:26px}
.nav button[aria-current="page"]{color:var(--fg)}
.nav button[aria-current="page"] .ico{background:var(--yellow);color:var(--yellow-ink)}
.nav .ico{display:grid;place-items:center;width:52px;height:30px;border-radius:15px}
/* Celular: 4 menús + "Más"; el resto se abre en una hoja desde abajo. */
.nav .nav-mas{display:flex}
@media (max-width:759px){.nav .extra{display:none}.nav button{min-width:0;font-size:12px}.nav .ico{width:46px}}
.mas-hoja{position:fixed;left:8px;right:8px;bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--surface);border:1px solid var(--line);
  border-radius:18px;box-shadow:0 12px 40px rgba(20,36,110,.25);padding:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mas-hoja button{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--bg);border:0;border-radius:14px;padding:12px 4px;font:inherit;font-size:13px;font-weight:700;color:var(--fg);cursor:pointer;min-height:76px}
.mas-hoja button svg{width:26px;height:26px}.mas-hoja button[aria-current="page"]{background:var(--yellow);color:var(--yellow-ink)}
.mas-fondo{position:fixed;inset:0;z-index:35;background:rgba(10,20,60,.25)}
@media (min-width:760px){.nav .nav-mas,.mas-hoja,.mas-fondo{display:none!important}}
.nav .badge{position:absolute;margin-left:30px;margin-top:-4px;background:var(--bad);color:#fff;font-size:11px;border-radius:9px;padding:0 6px;line-height:18px}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 110px;min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:14px 0 10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top h1{font-size:clamp(24px,7vw,30px);flex:1;min-width:200px;overflow:hidden;text-overflow:ellipsis}
.top .sub{font-size:15px;color:var(--fg-2);font-family:var(--f-body);font-weight:400;display:block;letter-spacing:0}
.back{background:none;border:0;color:var(--info);font-weight:700;cursor:pointer;padding:0;font-size:15px;display:block;margin-bottom:2px;font-family:var(--f-body)}
@media (min-width:760px){
  .app{grid-template-columns:96px minmax(0,1fr)}
  .nav{position:sticky;top:0;bottom:auto;height:100vh;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:12px 0;gap:4px;justify-content:flex-start;overflow-y:auto;overflow-x:hidden}
  .nav button{flex:0 0 auto;min-height:74px}
  .nav-brand{display:grid;place-items:center;height:56px;margin-bottom:8px}
  main{padding-bottom:40px;padding-right:24px;padding-left:24px}
}

/* ---------- Controles ---------- */
.btn{min-height:52px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-weight:700;padding:10px 16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;text-decoration:none;color:var(--fg)}
.btn svg{width:22px;height:22px;flex:none}
.btn.primary{background:var(--steel);color:var(--steel-fg);border-color:var(--steel)}
.btn.accent{background:var(--yellow);color:var(--yellow-ink);border-color:var(--yellow)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{min-height:44px;padding:6px 14px;font-size:16px}
.btn.xs{min-height:36px;padding:4px 10px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.lnk{background:none;border:0;color:var(--info);font-weight:700;cursor:pointer;padding:6px 0;min-height:36px}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lbl{font-weight:700}
.field .hint,.hint{font-size:15px;color:var(--fg-2)}
.inp{min-height:52px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface-2);padding:10px 14px;width:100%;min-width:0}
textarea.inp{min-height:96px;resize:vertical}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.form{display:flex;flex-direction:column;gap:18px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{min-height:46px;padding:8px 16px;border-radius:23px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;font-size:16px}
.pill[aria-pressed="true"]{background:var(--steel);color:var(--steel-fg);border-color:var(--steel)}
.pill small{font-weight:400;opacity:.8}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;padding:3px 10px;border-radius:12px;white-space:nowrap}
.chip::before{content:"";width:8px;height:8px;border-radius:4px;background:currentColor}
.c-ok{color:var(--ok);background:var(--ok-bg)} .c-warn{color:var(--warn);background:var(--warn-bg)}
.c-bad{color:var(--bad);background:var(--bad-bg)} .c-info{color:var(--info);background:var(--info-bg)}
.c-mute{color:var(--fg-2);background:var(--surface-2)} .c-vio{color:var(--vio);background:var(--vio-bg)}
.tag{font-size:13px;color:var(--fg-2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.secttl{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 0 10px}
.secttl h2{font-size:24px}
.empty{text-align:center;padding:36px 18px;background:var(--surface);border:1.5px dashed var(--line);border-radius:var(--r);display:flex;flex-direction:column;align-items:center;gap:12px}
.empty p{margin:0;color:var(--fg-2)}
.loading{padding:30px;text-align:center;color:var(--fg-2)}
.warnbox{background:var(--bad-bg);color:var(--bad);padding:14px;border-radius:var(--r);font-weight:700}
.okbox{background:var(--ok-bg);color:var(--ok);padding:14px;border-radius:var(--r);font-weight:700}
.notice{background:var(--warn-bg);color:var(--warn);padding:12px 14px;border-radius:var(--r);font-weight:700;margin-bottom:12px}
.check{display:flex;align-items:center;gap:10px;min-height:48px;font-weight:700}
.check input{width:24px;height:24px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);padding:12px 20px;border-radius:24px;font-weight:700;opacity:0;transition:.2s;z-index:80;pointer-events:none;width:max-content;max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast.err{background:var(--bad);color:#fff}
@media (min-width:760px){.toast{bottom:28px}}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.me{width:48px;height:48px;border-radius:24px;border:0;background:var(--steel);color:var(--steel-fg);font-weight:700;font-size:17px;cursor:pointer;flex:none}
.only-narrow{display:block} .only-wide{display:none}
@media (min-width:900px){.only-narrow{display:none!important} .only-wide{display:block}}

/* ---------- Libro ---------- */
.filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
.filters .q{grid-column:1/-1}
@media (min-width:900px){.filters{grid-template-columns:150px 150px 170px 170px minmax(0,1fr) auto}.filters .q{grid-column:auto}}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
@media (min-width:900px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat span{font-size:14px;color:var(--fg-2)}
.xl tr.rn-fila td{background:#f3f0fb}.xl tr.rn-tot td{background:#ece7f8;font-weight:700}
.asis{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;padding:10px 4px;border-top:1px solid var(--line)}
.asis.ok{background:linear-gradient(90deg,var(--ok-bg),transparent 60%)}.asis.no{background:linear-gradient(90deg,#fdecec,transparent 60%)}
.asis-n{display:flex;flex-direction:column;gap:2px;min-width:240px;flex:1}.asis-n .chip{align-self:flex-start}.asis-a{display:flex;gap:6px;align-items:flex-end;flex-wrap:wrap}
.c-bad{color:var(--bad);background:#fdecec}
.dash{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:14px}
@media (min-width:1000px){.dash{grid-template-columns:1fr 1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.panel h3{margin:0 0 2px;font-size:16px}.panel .sub{font-size:13px;color:var(--fg-2);margin:0 0 8px}
.cv{position:relative;height:260px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}.chips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font:inherit;font-size:14px;cursor:pointer}
.meta-row{display:grid;grid-template-columns:minmax(0,1.4fr) 2fr auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
@media (max-width:599px){.meta-row{grid-template-columns:1fr auto}.meta-row .meta-bar{grid-column:1/-1;order:3}}
.meta-bar{height:10px;border-radius:5px;background:#eceae4;position:relative;overflow:hidden}.meta-bar i{position:absolute;inset:0 auto 0 0;border-radius:5px}
.est{font-size:13px;font-weight:700;white-space:nowrap}
.tabla{width:100%;border-collapse:collapse;font-size:14px}.tabla th,.tabla td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.tabla th{font-size:12px;color:var(--fg-2);text-transform:uppercase;letter-spacing:.04em}.tabla td.n{text-align:right;font-variant-numeric:tabular-nums}
.stat b{white-space:nowrap;font-family:var(--f-display);font-size:clamp(20px,5.4vw,28px);font-variant-numeric:tabular-nums;line-height:1.1}
.stat .btn{margin-top:6px;align-self:flex-start}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%;min-height:72px;color:inherit}
.item:last-child{border-bottom:0}
.item .t{font-weight:700;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.item .s{font-size:15px;color:var(--fg-2);display:block}
.item .r2{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.mes{padding:8px 14px;background:var(--surface-2);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-2);border-bottom:1px solid var(--line)}
.selbox{width:24px;height:24px}
.thumb{width:48px;height:48px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--fg-2);border:1px solid var(--line)}
.thumb svg{width:24px;height:24px}
.dots{display:inline-flex;gap:3px;align-items:center}
.dot{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font-size:11px;font-weight:700;background:var(--surface-2);color:var(--fg-2);border:1px solid var(--line)}
.dot.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}

/* ---------- Tabla de la hoja ---------- */
.tw{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
table.grid{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.grid th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--fg-2);font-weight:700;padding:10px 8px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
.grid td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.grid tfoot td{background:var(--surface-2);font-weight:700;white-space:nowrap}
.grid .r,.r{text-align:right}.c{text-align:center}.nw{white-space:nowrap}
.firma-mini{max-height:36px;max-width:120px;display:block;margin:0 auto}
/* ---------- Hoja tipo Excel ---------- */
.xl-wrap{overflow:auto;background:#fff;border:1px solid #b9c4d0;border-radius:6px;-webkit-overflow-scrolling:touch;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.xl{border-collapse:separate;border-spacing:0;table-layout:fixed;width:100%;min-width:1280px;font-family:Calibri,Carlito,"Segoe UI",Arial,sans-serif;font-size:13px;color:#000;background:#fff;line-height:1.25}
.xl td,.xl th{border:0;border-right:1px solid #000;border-bottom:1px solid #000;padding:3px 6px;vertical-align:middle;overflow:hidden;background:#fff}
.xl tbody tr:nth-child(1) td{border-top:1px solid #000}.xl tbody td:nth-child(2),.xl tbody th:nth-child(2){border-left:1px solid #000}
.xl .cl{background:#f3f3f3!important;color:#555;border:0!important;border-right:1px solid #d4d4d4!important;border-bottom:1px solid #d4d4d4!important;font-weight:400;text-align:center;font-size:11px;padding:2px;position:sticky;left:0;z-index:1}
.xl thead .cl{position:sticky;top:0;left:auto;z-index:2}.xl thead .cl:first-child{left:0;z-index:3}
.xl .tit{font-size:24px;font-weight:700;text-align:center;height:46px;letter-spacing:.5px}
.xl .logo img{height:50px;display:block;margin:4px auto}
.xl .rep{font-size:17px;font-weight:700;text-align:center}.xl .rep small{display:block;font-size:12px;font-weight:400;margin-top:2px}
.xl .hd th{background:#d9e1f2!important;font-weight:700;text-align:center;font-size:11.5px;height:34px}
.xl .c{text-align:center}.xl .r{text-align:right}.xl .b{font-weight:700}.xl .nw{white-space:nowrap}
.xl .nm{font-weight:700}.xl .sop{font-size:12px}.xl .sop i{display:block;color:#444}
.xl .fc{height:46px;text-align:center;padding:2px;position:sticky;right:0;z-index:1;box-shadow:-3px 0 6px rgba(0,0,0,.08);border-left:1px solid #000}
.xl .hd th:last-child{position:sticky;right:0;z-index:1;border-left:1px solid #000;box-shadow:-3px 0 6px rgba(0,0,0,.08)}
.xl .fc img{max-height:40px;max-width:136px;display:block;margin:0 auto}
.xl .tot td{background:#f2f2f2;font-weight:700}
.xl .pf{position:relative}
.xl .vacia td{height:18px;border-left-color:transparent;border-right-color:transparent}
.xl .pie td.pf{height:96px;text-align:center;vertical-align:bottom;position:relative}
.xl .pf img{max-height:84px;max-width:260px}
.xl .pn{font-size:12px;height:24px}
.xl-firmar{border:1.5px dashed #4cc3f0;background:#eef9fe;color:#14246e;border-radius:6px;font:700 13px/1 var(--f-body);padding:9px 10px;cursor:pointer;width:100%;min-height:38px}
.xl-firmar:hover{background:#d9f2fc}.xl-firmar.grande{width:auto;padding:12px 18px;margin-bottom:6px}
.xl-x{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:11px;border:1px solid #ccc;background:#fff;color:#b4232c;font-weight:700;cursor:pointer;line-height:1;padding:0}
.xl-c{color:#888;font-size:11px}
.xl .fn{display:none}
@media (max-width:899px){.xl .fn{display:block;font-size:10px;font-weight:400;color:#444;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}.xl .fc img{max-height:30px}}
.fila-card{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-bottom:1px solid var(--line)}
.fila-card:last-child{border-bottom:0}
.fila-card .h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.fila-card .n{font-weight:700}
.fila-card .d{font-size:15px;color:var(--fg-2)}
.fila-card img{max-height:44px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:14px}
.step{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--fg-2);text-align:center}
.step i{height:8px;border-radius:4px;background:var(--line)}
.step.done i{background:var(--steel)} .step.cur i{background:var(--yellow)} .step.cur{color:var(--fg)}
.firmas{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:760px){.firmas{grid-template-columns:repeat(3,1fr)}}
.firma-box{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.firma-box.ok{border-color:var(--ok)}
.firma-area{height:90px;width:100%;display:flex;align-items:flex-end;justify-content:center;border-bottom:2px solid var(--fg);margin-bottom:6px;padding-bottom:4px;color:var(--fg-2)}
.firma-area img{max-height:84px;max-width:100%;background:#fff;border-radius:6px}
.firma-rol{font-weight:700;letter-spacing:.08em;font-size:14px}
.log{display:flex;flex-direction:column;gap:8px;border-left:3px solid var(--line);padding-left:14px;font-size:15px}
.log .w{font-size:13px;color:var(--fg-2)}
.menu{position:relative}
.menu-body{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:240px;padding:6px;z-index:25;display:flex;flex-direction:column}
.menu-body button{text-align:left;background:none;border:0;padding:12px;border-radius:8px;cursor:pointer;font-weight:700;color:var(--fg)}
.menu-body button:hover{background:var(--surface-2)} .menu-body .danger{color:var(--bad)}

/* ---------- Editor ---------- */
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:23px;overflow:hidden;background:var(--surface)}
.seg button{min-height:46px;padding:8px 18px;border:0;background:none;font-weight:700;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--steel);color:var(--steel-fg)}
details.bulk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
details.bulk summary{cursor:pointer;font-weight:700;font-size:18px}
.bulk-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.bulk-fields .w2{grid-column:1/-1}
@media (min-width:900px){.bulk-fields{grid-template-columns:160px 220px 120px 120px minmax(0,1fr) minmax(0,1fr)}.bulk-fields .w2{grid-column:auto}}
.pick-head{display:flex;gap:8px;margin:12px 0 8px;flex-wrap:wrap}
.pick-head .inp{flex:1;min-width:180px;width:auto}
.checklist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:var(--r)}
.checklist label{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);min-height:48px;cursor:pointer;font-size:15px}
.checklist label:has(input:checked){background:var(--info-bg)}
.checklist input{width:22px;height:22px;flex:none}
.checklist small{color:var(--fg-2);margin-left:auto;font-size:12px;text-align:right}
.filas{display:flex;flex-direction:column;gap:10px}
.fila{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 10px;position:relative}
.fila.firmada{box-shadow:inset 4px 0 0 var(--ok)}
.fila .n{grid-column:1/-1;font-weight:700;color:var(--fg-2);font-size:14px;display:flex;justify-content:space-between;align-items:center}
.fila .emp,.fila .sop{grid-column:1/-1}
.fila label{display:flex;flex-direction:column;gap:2px;font-size:13px;font-weight:700;color:var(--fg-2)}
.fila .inp{min-height:44px;padding:6px 10px;font-size:16px;color:var(--fg)}
.fila .info{font-size:14px;color:var(--fg-2)}
.fila input[type=time],.fila input[type=date]{font-size:15px;padding:6px 8px}
.fila .costo{font-weight:700;font-variant-numeric:tabular-nums;align-self:end;padding-bottom:10px}
.inp.manual{background:var(--warn-bg);border-color:var(--warn)} .inp.bad{border-color:var(--bad);background:var(--bad-bg)}
.icon{border:1px solid var(--line);background:var(--surface-2);cursor:pointer;width:40px;height:40px;border-radius:20px;display:inline-grid;place-items:center;color:var(--fg-2)}
.icon svg{width:20px;height:20px}
@media (min-width:1440px){
  .fila{grid-template-columns:30px 150px 165px minmax(180px,1.3fr) 112px 112px 70px 96px minmax(160px,1fr) 88px;align-items:end;padding:8px 10px}
  .fila .n{grid-column:auto;align-self:center;font-size:15px}
  .fila .emp,.fila .sop{grid-column:auto}
  .fila label>span.l{display:none}
  .fila .n .acts{display:none}
  .fila .acts2{display:flex!important;gap:4px;align-self:center}
  .fila-head{display:grid!important;grid-template-columns:30px 150px 165px minmax(180px,1.3fr) 112px 112px 70px 96px minmax(160px,1fr) 88px;gap:8px 10px;padding:0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--fg-2);font-weight:700}
}
.fila .acts2,.fila-head{display:none}
.savebar{position:sticky;bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;box-shadow:var(--shadow);margin-top:14px}
@media (min-width:760px){.savebar{bottom:12px}}
.savebar .res{margin-right:auto;font-weight:700;font-variant-numeric:tabular-nums}
@media (max-width:759px){.savebar{padding:8px 10px;gap:8px;flex-wrap:nowrap}.savebar .res{font-size:13px}.savebar .btn{min-height:44px;padding:6px 12px}.savebar .cancel{display:none}}
.top-act{order:3;width:100%}
@media (min-width:900px){.top-act{order:0;width:auto}}

/* ---------- Firma ---------- */
dialog{border:0;border-radius:14px;padding:0;width:min(720px,96vw);max-height:96vh;background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(10,16,22,.55)}
.dlg{padding:18px;display:flex;flex-direction:column;gap:12px}
.dlg h3{font-size:26px}.dlg p{margin:0}
.pad-wrap{position:relative;border:2px dashed var(--line);border-radius:12px;background:#fff}
#pad{display:block;width:100%;height:min(46vh,280px);touch-action:none;cursor:crosshair}
.pad-hint{position:absolute;left:0;right:0;bottom:42%;text-align:center;color:#b3bcc8;pointer-events:none;font-size:18px}
.pad-wrap::after{content:"";position:absolute;left:8%;right:8%;bottom:56px;border-bottom:1.5px solid #c3cad8;pointer-events:none}
dialog.trazo .pad-hint{display:none}
.dlg-foot{display:flex;gap:10px;flex-wrap:wrap}.dlg-foot .sp{flex:1}
.foto-est{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:6px 0;border-top:1px solid var(--line);flex-basis:100%}.foto-est .sp{flex:1}
.lect-extra{display:flex;flex-direction:column;gap:6px}.lect-extra .lx{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.lect-extra .lx .inp{width:140px}
@media (max-width:700px){
  #dlg-lect{width:100vw;max-width:100vw;max-height:100vh;height:100vh;border-radius:0;margin:0}
  #dlg-lect .dlg{padding:14px;height:100%;box-sizing:border-box;overflow:auto}
  #dlg-lect table,#dlg-lect tbody{display:block}#dlg-lect thead{display:none}
  #dlg-lect tr[data-lk]{display:grid;grid-template-columns:30px 1fr 1fr;gap:6px 8px;padding:10px 0;border-bottom:1px solid var(--line)}
  #dlg-lect tr[data-lk] td{display:block;padding:0;border:0;min-width:0!important}
  #dlg-lect tr[data-lk] td[data-et]::before{content:attr(data-et);display:block;font-size:12px;color:var(--fg-2);margin-bottom:2px}
  #dlg-lect tr[data-lk] td:nth-child(1){grid-row:1/4}#dlg-lect tr[data-lk] td:nth-child(2){grid-column:2/4}
  #dlg-lect tr[data-lk] td:nth-child(5){grid-column:2/4}
  #dlg-lect tr[data-lk] input[type=time],#dlg-lect tr[data-lk] select{width:100%!important}
  #dlg-lect div[style*="max-height:58vh"]{max-height:none!important;overflow:visible!important}
  #dlg-lect .lect-extra .lx .inp{flex:1;width:auto;min-width:120px}
  #dlg-lect .dlg-foot{position:sticky;bottom:-14px;background:var(--surface);padding:10px 0;margin-bottom:-14px}
  #dlg-lect .dlg-foot .btn{flex:1}#dlg-lect .dlg-foot .sp{display:none}}

/* ---------- Ingreso ---------- */
.auth{min-height:100%;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.auth-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px 20px;display:flex;flex-direction:column;gap:18px}
.spin{width:34px;height:34px;border-radius:50%;border:4px solid #d9e6f7;border-top-color:#2a78d6;margin:4px auto 10px;animation:giro 1s linear infinite}
@keyframes giro{to{transform:rotate(360deg)}}
.auth-brand{display:flex;align-items:center;gap:12px}
.auth-brand .logo{width:52px;height:52px;border-radius:12px;background:#14246e;color:#fff;display:grid;place-items:center;flex:none}
.auth-brand .logo svg{width:30px;height:30px}
.auth-brand h1{font-size:30px}
.auth-brand p{margin:0;color:var(--fg-2);font-size:15px}
.auth .lnk{min-height:44px}
.usr{display:flex;flex-direction:column;gap:10px;padding:14px;border-bottom:1px solid var(--line)}
.usr:last-child{border-bottom:0}
.usr .h{display:flex;align-items:center;gap:12px}
.usr .h>span:nth-child(2){flex:1;min-width:0}
.avatar{width:48px;height:48px;border-radius:24px;background:var(--info-bg);color:var(--info);display:grid;place-items:center;font-weight:700;font-size:18px;flex:none}
.cols{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
@media (min-width:1100px){.cols{grid-template-columns:minmax(0,1fr) 380px}}
.jor{display:grid;grid-template-columns:56px minmax(0,1fr) 90px 44px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
</style>
</head>
<body>
<div id="auth" hidden></div>
<div class="app" id="app" hidden>
  <nav class="nav" id="nav" aria-label="Secciones"></nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<dialog id="dlg-firma"><div class="dlg">
  <h3 id="df-titulo">Firmar</h3><p class="hint" id="df-sub"></p>
  <div class="row2" id="df-campos"><div class="field"><label for="df-nombre">Nombre</label><input class="inp" id="df-nombre"></div><div class="field"><label for="df-cargo">Cargo</label><input class="inp" id="df-cargo"></div></div>
  <div class="pad-wrap"><canvas id="pad"></canvas><span class="pad-hint">Firme dentro del recuadro</span></div>
  <div class="dlg-foot"><button class="btn" id="df-limpiar">Limpiar</button><span class="sp"></span><button class="btn" id="df-cancelar">Cancelar</button><button class="btn primary" id="df-guardar">Guardar firma</button></div>
</div></dialog>
<dialog id="dlg-imp"><div class="dlg">
  <h3>Actualizar desde el libro Excel</h3><p class="hint">Revise lo que va a cambiar antes de aplicarlo.</p>
  <div id="di-body" class="stack" style="max-height:60vh;overflow:auto"></div>
  <div class="dlg-foot"><span class="sp"></span><button class="btn" id="di-no">Cancelar</button><button class="btn primary" id="di-ok">Aplicar actualización</button></div>
</div></dialog>
<dialog id="dlg-print" style="width:min(460px,94vw)"><div class="dlg">
  <h3 id="dp-titulo">Formato de impresión</h3><p class="hint" style="margin-top:0">Cada hoja se ajusta completa a una página del tamaño elegido.</p>
  <div class="form">
    <div class="field"><label for="dp-papel">Tamaño de hoja</label><select class="inp" id="dp-papel"></select></div>
    <div class="field"><span class="lbl">Orientación</span><div class="seg" id="dp-orient"><button type="button" data-v="landscape">Horizontal</button><button type="button" data-v="portrait">Vertical</button></div></div>
    <label id="dp-val-w" style="display:flex;gap:10px;align-items:center;font-size:16px"><input type="checkbox" id="dp-val" style="width:22px;height:22px"> Incluir salarios, recargos y costos</label>
  </div>
  <div class="dlg-foot"><span class="sp"></span><button class="btn" id="dp-no">Cancelar</button><button class="btn primary" id="dp-ok">Continuar</button></div>
</div></dialog>
<dialog id="dlg-meta" style="width:min(560px,94vw)"><div class="dlg">
  <h3 id="dm-titulo">Metas de horas extras</h3><div id="dm-body"></div>
  <div class="dlg-foot"><span class="sp"></span><button class="btn" id="dm-no">Revisar la hoja</button><button class="btn primary" id="dm-si">Guardar de todas formas</button></div>
</div></dialog>
<dialog id="dlg-sel" style="width:min(440px,94vw)"><div class="dlg">
  <h3 id="ds-titulo">Elegir</h3><p class="hint" id="ds-msg" style="margin-top:0"></p><select class="inp" id="ds-sel"></select>
  <div class="dlg-foot"><span class="sp"></span><button class="btn" id="ds-no">Cancelar</button><button class="btn primary" id="ds-si">Guardar</button></div>
</div></dialog>
<dialog id="dlg-ok" style="width:min(480px,94vw)"><div class="dlg">
  <h3 id="dc-titulo">Confirmar</h3><p id="dc-msg"></p>
  <div class="dlg-foot"><span class="sp"></span><button class="btn" id="dc-no">Cancelar</button><button class="btn primary" id="dc-si">Continuar</button></div>
</div></dialog>

<script>
"use strict";
/* ================= Íconos ================= */
const I = {
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  money:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M6 12h.01M18 12h.01"/>',
  trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/>',
  chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  book:'<path d="M4 4h6a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4zM20 4h-6a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h7z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  team:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a5 5 0 0 1 3.5 6"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  pen:'<path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"/>',
  pdf:'<path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6M9 14h6M9 18h6"/>',
  print:'<path d="M7 9V3h10v6M7 17H4v-7h16v7h-3"/><path d="M7 14h10v7H7z"/>',
  xls:'<path d="M4 4h16v16H4z"/><path d="M4 10h16M10 4v16"/>',
  camera:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4.5-7 8-7s7 2.5 8 7"/>',
  copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M4 16V4h12"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  check:'<path d="M5 12l5 5 9-10"/>',
  arrow:'<path d="M9 6l6 6-6 6"/>',
  key:'<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M15 8l2 2"/>',
  more:'<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>'
};
const MARCA = s => `<svg viewBox="0 0 122 134" width="${s}" height="${s*1.1}" aria-hidden="true"><path d="M63 0L0 33V101L62 134V66L122 34.5V31L106 23L43 56V91C43 97 36 99 30 95C25 92 22 88 22 84V44L83 11Z" fill="currentColor"/></svg>`;
const svg = (n,extra='') => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra}>${I[n]}</svg>`;

/* ================= Constantes y utilidades ================= */
const ROLES = { ELABORA: "Elabora", AUTORIZA: "Autoriza", LIQUIDA: "Liquida GH" };
const TIPOS = { AUTORIZACION: "Autorización", LEGALIZACION: "Legalización" };
const ESTADOS = { borrador: ["Borrador","c-mute"], firmado: ["Firmado","c-warn"], legalizado: ["Legalizado","c-vio"], cerrado: ["Cerrado","c-ok"] };
const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const DIAS = ["DOMINGO","LUNES","MARTES","MIERCOLES","JUEVES","VIERNES","SABADO"], ABR = ["DOM","LUN","MAR","MIE","JUE","VIE","SAB"];
const $ = (s, el = document) => el.querySelector(s), $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = v => "$ " + Math.round(v || 0).toLocaleString("es-CO");
const num = v => (Math.round((v || 0) * 100) / 100).toLocaleString("es-CO");
const fc = f => f ? f.slice(8, 10) + "/" + f.slice(5, 7) + "/" + f.slice(0, 4) : "";
const fh = iso => iso ? fc(iso.slice(0, 10)) + " " + iso.slice(11, 16) : "";
const ahora = () => { const d = new Date(), p = n => String(n).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; };
const rid = () => Math.random().toString(36).slice(2, 10);
const r2 = v => Math.round(v * 100) / 100;
const dow = f => new Date(f + "T12:00:00").getDay();
const iniciales = n => (n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(p=>p[0]).join('').toUpperCase();
function horasEntre(a, b) {
  if (!a || !b) return 0;
  const [h1, m1] = a.split(":").map(Number), [h2, m2] = b.split(":").map(Number);
  let m = (h2 * 60 + m2) - (h1 * 60 + m1); if (m <= 0) m += 1440;
  return r2(m / 60);
}
const costo = (sal, rec, h, div) => div ? r2(sal / div * rec * h) : 0;
function tituloAuto(fechas) {
  const f = [...new Set(fechas.filter(Boolean))].sort();
  if (!f.length) return "";
  const d = f.map(x => new Date(x + "T12:00:00")), p = n => String(n).padStart(2, "0");
  const fmt = x => x.getDate() + "-" + p(x.getMonth() + 1);
  if (d.length === 1) return DIAS[d[0].getDay()] + " " + fmt(d[0]) + "-" + d[0].getFullYear();
  const a = d[0], b = d[d.length - 1], mismo = a.getMonth() === b.getMonth() && a.getFullYear() === b.getFullYear();
  const consec = d.every((x, i) => i === 0 || Math.round((x - d[i - 1]) / 864e5) === 1);
  if (consec && d.length > 2) return `${ABR[a.getDay()]} A ${ABR[b.getDay()]} ${mismo ? a.getDate() : fmt(a)} AL ${fmt(b)}-${b.getFullYear()}`;
  const dias = [...new Set(d.map(x => ABR[x.getDay()]))].join(" - ");
  if (mismo) { const n = d.map(x => x.getDate()); const u = n.pop(); return `${dias} ${n.join(", ")} Y ${u}-${p(a.getMonth() + 1)}-${a.getFullYear()}`; }
  return dias + " " + d.map(fmt).join(" Y ") + "-" + b.getFullYear();
}
function toast(msg, err){ const t=$('#toast'); t.textContent=msg; t.classList.toggle('err',!!err); t.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'), err?5500:2800); }
function confirmar(msg, titulo = "Confirmar", si = "Continuar") {
  const d = $("#dlg-ok"); $("#dc-titulo").textContent = titulo; $("#dc-msg").textContent = msg; $("#dc-si").textContent = si;
  return new Promise(res => {
    const fin = v => { d.close(); $("#dc-si").onclick = $("#dc-no").onclick = null; d.oncancel = null; res(v); };
    $("#dc-si").onclick = () => fin(true); $("#dc-no").onclick = () => fin(false); d.oncancel = e => { e.preventDefault(); fin(false); };
    d.showModal();
  });
}

/* Festivos de Colombia: fijos, los que se corren al lunes (Ley Emiliani) y los que dependen de la Pascua. */
const _FEST = {};
function festivosCO(y) {
  if (_FEST[y]) return _FEST[y];
  const iso = d => d.toISOString().slice(0, 10), D = (m, d) => new Date(Date.UTC(y, m - 1, d));
  const lunes = d => { const w = d.getUTCDay(); if (w !== 1) d.setUTCDate(d.getUTCDate() + ((8 - w) % 7)); return d; };
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, dd = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3),
    h = (19 * a + b - dd - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451),
    mes = Math.floor((h + l - 7 * m + 114) / 31), dia = ((h + l - 7 * m + 114) % 31) + 1, pascua = D(mes, dia);
  const masP = n => { const x = new Date(pascua); x.setUTCDate(x.getUTCDate() + n); return x; };
  const lista = [D(1, 1), D(5, 1), D(7, 20), D(8, 7), D(12, 8), D(12, 25), masP(-3), masP(-2), masP(43), masP(64), masP(71)]
    .concat([[1, 6], [3, 19], [6, 29], [8, 15], [10, 12], [11, 1], [11, 11]].map(([mm, d]) => lunes(D(mm, d))));
  return (_FEST[y] = new Set(lista.map(iso)));
}

function rangoMin(r) { const a = minutos(r.hi || "00:00"); let b = minutos(r.hf || "00:00"); if (b <= a) b += 1440; return [a, b]; }
function repetidas(fuente) {
  const g = {}, out = {};
  for (const f of (fuente || listaFormsLlegada())) { if (f.estado === "legalizado") continue;
    for (const r of f.filas) if (r.f && r.c && !esRN(r)) (g[r.c + "|" + r.f] ??= []).push({ f, r }); }
  for (const l of Object.values(g)) if (l.length > 1)
    for (let i = 0; i < l.length; i++) for (let j = i + 1; j < l.length; j++) {
      const [a1, b1] = rangoMin(l[i].r), [a2, b2] = rangoMin(l[j].r);
      if (a1 < b2 && a2 < b1) { (out[l[i].f.id + "|" + l[i].r.id] ??= []).push(l[j]); (out[l[j].f.id + "|" + l[j].r.id] ??= []).push(l[i]); }
    }

function recalcular(f) {

  f.rh = r2(rn.reduce((a, r) => a + (r.h || 0), 0)); f.rc = r2(rn.reduce((a, r) => a + (r.co || 0), 0));

const copia = id => JSON.parse(JSON.stringify(S.forms[id]));
async function ejecutar(fn){ try{ await fn(); }catch(e){ toast(e.message || 'No se pudo guardar.', true); } }
async function legalizar(id) {
  const g = S.forms[id], noA = g.filas.filter(r => r.as === "no").length, sinC = g.filas.filter(r => !r.as).length;
  if (!await confirmar(`Se creará la hoja de LEGALIZACIÓN con estas filas para ajustar las horas reales y recoger firmas.${noA ? ` No se incluyen ${noA} filas marcadas "No asistió".` : ""}${sinC ? ` Hay ${sinC} filas sin confirmar asistencia.` : ""}`, "Legalizar", "Legalizar")) return;
  ejecutar(async () => {
    const f = copia(id);
    const n = { tipo: "LEGALIZACION", titulo: f.titulo, estado: "borrador", div: f.div, origen: id, obs: f.obs || "", cc: f.cc || null, proy: f.proy || null, imp: 0, creado: ahora(), cerrado: null,
      pie: {}, firmadas: {}, filas: f.filas.filter(r => r.as !== "no").map(r => Object.assign({}, r)), log: [] };
    const noAsis = f.filas.filter(r => r.as === "no");
    recalcular(n); log(n, "Creó la legalización", "Desde la autorización #" + f.num + (noAsis.length ? ` · sin ${noAsis.length} que no asistieron` : ""));
    const nid = await crearForm(n);
    f.estado = "legalizado"; f.cerrado = ahora(); log(f, "Legalizó", "Hoja #" + S.forms[nid].num);
    await guardarForm(id, f);
    toast("Legalización creada. Ajuste las horas reales y recoja las firmas.");
    ir("editar-" + nid);

}
async function cerrar(id) {
  const f = copia(id), nf = Object.keys(f.firmadas || {}).length;
  const falta = f.tipo === "LEGALIZACION" && nf < f.filas.length ? `Faltan firmas de colaboradores (${nf}/${f.filas.length}). ` : "";
  if (!await confirmar(falta + "La hoja quedará cerrada y archivada en el libro.", "Cerrar y archivar", "Cerrar")) return;
  ejecutar(async () => { f.estado = "cerrado"; f.cerrado = ahora(); log(f, "Cerró y archivó"); await guardarForm(id, f); toast("Hoja cerrada y archivada."); render(false); });
}
async function reabrir(id) {
  if (!await confirmar("Al reabrir se quitan las firmas de Elabora, Autoriza y Liquida GH.", "Reabrir", "Reabrir")) return;
  ejecutar(async () => {
    for (const k of Object.keys(S.forms[id].pie || {})) await api('DELETE', `/api/firmas/${id}/${k}`);
    const g = copia(id); g.pie = {}; g.estado = "borrador"; g.cerrado = null; log(g, "Reabrió", "Se quitaron las firmas del pie");
    await guardarForm(id, g); ir("editar-" + id);

}
async function duplicar(id) {
  ejecutar(async () => {
    const f = copia(id), c = cfg();
    const n = { tipo: f.tipo, titulo: "", estado: "borrador", div: +c.divisor, origen: null, obs: "", cc: f.cc || null, proy: f.proy || null, imp: 0, creado: ahora(), cerrado: null, pie: {}, firmadas: {}, log: [],
      filas: f.filas.map(r => { const e = empCed(r.c), j = jorCod(r.j); const x = Object.assign({}, r, { id: rid() });
        if (e) { x.s = e[3]; x.a = e[2]; } if (j) { x.r = j.r; x.jn = j.n; } x.co = costo(x.s, x.r, x.h, +c.divisor);

async function eliminar(id) {
  if (!await confirmar("¿Eliminar esta hoja del libro? No se puede deshacer.", "Eliminar hoja", "Eliminar")) return;
  ejecutar(async () => {
    const f = copia(id);

/* ----- Firmas ----- */
const Pad = (() => {
  const dlg = $("#dlg-firma"), cv = $("#pad"), ctx = cv.getContext("2d");
  let trazos = 0, dib = false, ult = null, resolver = null;
  function ajustar() {
    const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.lineCap = ctx.lineJoin = "round"; ctx.strokeStyle = ctx.fillStyle = "#0b1f5c"; limpiar();
  }
  function limpiar() { ctx.clearRect(0, 0, cv.width, cv.height); trazos = 0; dlg.classList.remove("trazo"); }
  const pt = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top, p: e.pressure || .5 }; };
  cv.addEventListener("pointerdown", e => { e.preventDefault(); cv.setPointerCapture(e.pointerId); dib = true; ult = pt(e); ctx.beginPath(); ctx.arc(ult.x, ult.y, 1.1, 0, 7); ctx.fill(); });
  cv.addEventListener("pointermove", e => { if (!dib) return; e.preventDefault(); const p = pt(e);
    ctx.lineWidth = e.pointerType === "pen" ? 1.2 + p.p * 2.2 : 2.4; ctx.beginPath(); ctx.moveTo(ult.x, ult.y); ctx.lineTo(p.x, p.y); ctx.stroke(); ult = p;
    if (++trazos > 3) dlg.classList.add("trazo"); });
  ["pointerup", "pointercancel", "pointerleave"].forEach(ev => cv.addEventListener(ev, () => { dib = false; }));
  function png() {
    const w = cv.width, h = cv.height, d = ctx.getImageData(0, 0, w, h).data;
    let x0 = w, y0 = h, x1 = 0, y1 = 0;
    for (let y = 0; y < h; y += 2) for (let x = 0; x < w; x += 2) if (d[(y * w + x) * 4 + 3] > 10) { if (x < x0) x0 = x; if (y < y0) y0 = y; if (x > x1) x1 = x; if (y > y1) y1 = y; }
    if (x1 <= x0 || y1 <= y0) return null;
    const pad = 8, cw = x1 - x0 + pad * 2, ch = y1 - y0 + pad * 2, k = Math.min(1, 420 / cw, 140 / ch);
    const o = document.createElement("canvas"); o.width = Math.max(1, Math.round(cw * k)); o.height = Math.max(1, Math.round(ch * k));
    o.getContext("2d").drawImage(cv, x0 - pad, y0 - pad, cw, ch, 0, 0, o.width, o.height);
    return { img: o.toDataURL("image/png"), w: o.width, h: o.height };
  }
  $("#df-limpiar").onclick = limpiar;
  $("#df-cancelar").onclick = () => { dlg.close(); if (resolver) { const r = resolver; resolver = null; r(null); } };
  dlg.oncancel = e => { e.preventDefault(); $("#df-cancelar").onclick(); };
  $("#df-guardar").onclick = () => {
    const r = png(); if (!r) return toast("Dibuje la firma antes de guardar.", true);
    const campos = !$("#df-campos").hidden;
    if (campos && !$("#df-nombre").value.trim()) { $("#df-nombre").focus(); return toast("Escriba el nombre de quien firma.", true); }
    dlg.close(); const res = resolver; resolver = null;
    res(Object.assign(r, { nombre: $("#df-nombre").value.trim(), cargo: $("#df-cargo").value.trim() }));
  };
  return { pedir(o) {
    $("#df-titulo").textContent = o.titulo; $("#df-sub").textContent = o.sub || "";
    $("#df-campos").hidden = !o.campos; $("#df-nombre").value = o.nombre || ""; $("#df-cargo").value = o.cargo || "";
    dlg.showModal(); requestAnimationFrame(ajustar);
    return new Promise(r => { resolver = r; });
  } };
})();
async function guardarFirma(fid, k, datos) {
  await api('POST', `/api/firmas/${fid}/${k}`, Object.assign({ fecha: ahora() }, datos));
}
/* Una sola firma del colaborador queda en todos sus días de la hoja. */
async function firmarFila(fid, rowId, sub) {
  const f0 = S.forms[fid], r = f0.filas.find(x => x.id === rowId); if (!r) return false;
  const firm = f0.firmadas || {};
  const dias = f0.filas.filter(x => x.c === r.c && (x.id === rowId || !firm[x.id]));
  const lista = dias.map(x => `${fc(x.f)} ${x.hi}–${x.hf}`).join(" · ");
  const p = await Pad.pedir({ titulo: "Firma de " + r.n, sub: (sub ? sub + " · " : "") + (dias.length > 1 ? `Esta firma queda en sus ${dias.length} días: ` : "") + lista });
  if (!p) return false;
  try {
    await guardarFirma(fid, rowId, { img: p.img, w: p.w, h: p.h, nombre: r.n, tambien: dias.map(x => x.id).filter(x => x !== rowId) });
    const f = copia(fid); f.firmadas = Object.assign({}, f.firmadas); const t = ahora();
    dias.forEach(x => { f.firmadas[x.id] = t; });
    log(f, "Firma colaborador", r.n + (dias.length > 1 ? ` (${dias.length} días)` : ""));
    await guardarForm(fid, f); await firmasDe(fid, true); render(false); return true;
  } catch (e) { toast("No se guardó la firma: " + e.message, true); return false; }
}
async function firmarSecuencia(fid) {
  const f = S.forms[fid], firm = f.firmadas || {}, vistos = new Set(), pend = [];
  f.filas.forEach(r => { if (!firm[r.id] && !vistos.has(r.c)) { vistos.add(r.c); pend.push(r); } });
  for (let i = 0; i < pend.length; i++) {
    if (!await firmarFila(fid, pend[i].id, `Colaborador ${i + 1} de ${pend.length}`)) break;
  }
}
async function quitarFirmaFila(fid, rowId) {
  const f0 = S.forms[fid], r = f0.filas.find(x => x.id === rowId) || {};
  const ids = f0.filas.filter(x => x.c === r.c && (f0.firmadas || {})[x.id]).map(x => x.id);
  if (!await confirmar(`¿Quitar la firma de ${r.n}${ids.length > 1 ? ` en sus ${ids.length} días` : ""}?`, "Quitar firma", "Quitar")) return;
  ejecutar(async () => {
    for (const k of ids) await api('DELETE', `/api/firmas/${fid}/${k}`);
    const f = copia(fid); ids.forEach(k => delete f.firmadas[k]); log(f, "Quitó firma colaborador", r.n);
    await guardarForm(fid, f); await firmasDe(fid, true); render(false);
  });
}
async function firmarRol(fid, k) {
  const c = cfg()[k] || {};
  const p = await Pad.pedir({ titulo: "Firma: " + ROLES[k], sub: "Quien firma confirma el contenido de esta hoja.", campos: true, nombre: c.nombre || (k==='ELABORA'?S.yo.nombre:''), cargo: c.cargo });
  if (!p) return;
  ejecutar(async () => {
    await guardarFirma(fid, k, { img: p.img, w: p.w, h: p.h, nombre: p.nombre, cargo: p.cargo });
    const f = copia(fid); f.pie = Object.assign({}, f.pie, { [k]: { nombre: p.nombre, cargo: p.cargo, fecha: ahora() } });
    recalcular(f); log(f, "Firma " + ROLES[k], p.nombre); const g = await guardarForm(fid, f); await firmasDe(fid, true); render(false);
    if (g.estado === "firmado") toast(g.tipo === "AUTORIZACION" ? "Hoja firmada. Ya puede legalizarla." : "Hoja firmada. Ya puede cerrarla.");
  });
}
async function quitarFirmaRol(fid, k) {
  if (!await confirmar("¿Quitar esta firma?", "Quitar firma", "Quitar")) return;

    await api('DELETE', `/api/firmas/${fid}/${k}`);

}

/* Una fila por colaborador + centro de costo + concepto. */
function planoSemana(s) {
  const m = new Map();
  for (const { r, f } of s.filas) {
    const k = [r.c, f.cc || "", r.j].join("|");
    const g = m.get(k) || { c: r.c, n: r.n, a: r.a, cc: f.cc || "", j: r.j, jn: r.jn, fac: r.r, s: r.s, div: f.div || 210, h: 0, v: 0, fest: 0 };
    g.h += r.h || 0; g.v += r.co || 0; if (tipoDia(r) === "FESTIVO") g.fest += r.h || 0; m.set(k, g);
  }
  return [...m.values()].sort((a, b) => a.n.localeCompare(b.n) || a.j.localeCompare(b.j));
}

  const pl = planoSemana(s);

    <tbody>${pl.map(g => `<tr><td>${esc(g.c)}</td><td>${esc(g.n)}</td><td>${esc(g.cc || "—")}</td><td>${esc(g.j)} · ${esc(g.jn)}${g.fest ? " <b>(festivo)</b>" : ""}</td><td class="n">${num(g.h)}</td>${val ? `<td class="n">${money(g.v)}</td>` : ""}</tr>`).join("")}</tbody></table></div>`;
}

/* Busca la escala más grande con la que la hoja completa (filas y firmas) cabe en UNA página. */
function escalaUnaPagina(f, fir, c, logo, op) {
  for (let s = 1; s >= .3; s = Math.round((s - .05) * 100) / 100) {
    const prueba = nuevoPDF(op);
    dibujarHoja(prueba, f, fir, s, c, logo, op);
    if (prueba.getNumberOfPages() === 1) return s;
  }

  else if(modo==='solicitar') a.innerHTML=authCard(`<p style="margin:0">Pida acceso. El administrador debe aprobarlo antes de que pueda entrar.</p>
    <form class="form" id="afrm" data-modo="solicitar">
      <div class="field"><label for="a_nom">Nombre completo</label><input class="inp" id="a_nom" required autocomplete="name"></div>
      <div class="field"><label for="a_usr">Usuario</label><input class="inp" id="a_usr" required autocapitalize="none" autocomplete="username" placeholder="Sin espacios, ej.: jperez"></div>
      <div class="field"><label for="a_clv">Clave (mín. 6)</label><input class="inp" id="a_clv" type="password" required minlength="6" autocomplete="new-password"></div>
      <div id="amsg"></div><button class="btn accent" type="submit">Enviar solicitud</button></form>
    <button class="lnk" data-amodo="ingresar">Ya tengo acceso: ingresar</button>`);
  else a.innerHTML=authCard(`<form class="form" id="afrm" data-modo="ingresar">
      <div class="field"><label for="a_usr">Usuario</label><input class="inp" id="a_usr" required autocapitalize="none" autocomplete="username"></div>
      <div class="field"><label for="a_clv">Clave</label><input class="inp" id="a_clv" type="password" required autocomplete="current-password"></div>
      <div id="amsg"></div><button class="btn primary" type="submit">Ingresar</button></form>
    <button class="lnk" data-amodo="solicitar">No tengo acceso: solicitarlo</button>`);
}
async function enviarIngreso(f){
  const modo=f.dataset.modo, btn=f.querySelector('[type=submit]'), msg=$('#amsg');
  btn.disabled=true; msg.innerHTML='';
  const body={usuario:$('#a_usr').value, clave:$('#a_clv').value, nombre:$('#a_nom')?.value, codigo:$('#a_cod')?.value};
  try{
    await api('POST',{instalar:'/api/instalar',solicitar:'/api/solicitar',ingresar:'/api/ingresar'}[modo],body);
    if(modo==='solicitar'){ f.outerHTML=`<div class="okbox">Solicitud enviada. Podrá ingresar cuando el administrador la apruebe.</div>`; return; }
    await entrar();
  }catch(e){ btn.disabled=false; msg.innerHTML=`<div class="warnbox">${esc(e.message)}</div>`; }
}
async function entrar(){
  const e = await api('GET','/api/estado');
  S.instalado=e.instalado;
  if(!e.usuario){ mostrarIngreso(); return; }
  S.yo=e.usuario; S.ultimo=0; S.cargado=false;
  $('#auth').hidden=true; $('#app').hidden=false;
  const pintar=()=>{ try{ render(true); }catch(err){ console.error(err); const m=$('#main')||$('#app');
    if(m) m.innerHTML=`<div class="warnbox" style="margin:16px">Esta pantalla tuvo un error (${esc(err.message)}). Use el menú para ir a otra o toque Reparar la app.<br><button class="btn" onclick="repararApp()">Reparar la app</button></div>`; } };
  pintar();
  await sync(); pintar(); cargarUsuarios();
}

/* ================= Eventos ================= */
document.addEventListener('click', e=>{
  const am=e.target.closest('[data-amodo]'); if(am){ mostrarIngreso(am.dataset.amodo); return; }
  const ua=e.target.closest('[data-uacc]'); if(ua){ accionUsuario(ua); return; }
  const na=e.target.closest('[data-navanio]'); if(na){ e.preventDefault(); F.navAbierto = F.navAbierto===na.dataset.navanio ? "" : na.dataset.navanio; renderNav(); return; }
  const nna=e.target.closest('[data-navnanio]'); if(nna){ e.preventDefault(); NOM.navAbierto = NOM.navAbierto===nna.dataset.navnanio ? "" : nna.dataset.navnanio; renderNav(); return; }
  const nnm=e.target.closest('[data-navnmes]'); if(nnm){ e.preventDefault(); NOM.mes=nnm.dataset.navnmes; NOM.abierta=null; NOM.anioAbierto = NOM.mes==="curso" ? "" : NOM.mes.slice(0,4); if(S.vista==='nomina') render(false); else ir('nomina'); renderNav(); return; }
  const nm=e.target.closest('[data-navmes]'); if(nm){ e.preventDefault(); F.mes=nm.dataset.navmes; Object.assign(F,{desde:"",hasta:"",q:""}); F.sel.clear(); if(S.vista==='libro') render(false); else ir('libro'); renderNav(); return; }
  const g=e.target.closest('[data-go]'); if(g){ e.preventDefault(); if(S.masAbierto){ S.masAbierto=false; renderNav(); } ir(g.dataset.go); return; }
  const m=$('#a-menu'); if(m && !e.target.closest('.menu')) m.hidden=true;
});
document.addEventListener('submit', e=>{ if(e.target.id==='afrm'){ e.preventDefault(); enviarIngreso(e.target); } });
document.addEventListener('change', e=>{ if(e.target.classList.contains('f-excel')){ const f=e.target.files[0]; e.target.value=''; const t=e.target; importarLibro(f, t.dataset.dueno ? { id: t.dataset.dueno, nombre: t.dataset.dnom } : null); } });
window.addEventListener('hashchange', () => render(true));
window.addEventListener('beforeunload', e => { if (S.vista === 'editar' || S.vista === 'nuevo') { if (S.editor && S.editor.filas.length) { e.preventDefault(); e.returnValue = ''; } } });
setInterval(()=>{ if(S.yo && document.visibilityState==='visible') sync(); }, 30000); // cada 30 s: alivia la base en horas pico
setInterval(()=>{ if(S.yo && esPrincipal() && document.visibilityState==='visible') cargarUsuarios(true); }, 60000);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') sync(); });
/* Arranque: si el servidor estaba dormido, se muestra un aviso con el tiempo transcurrido y se reintenta solo
   hasta que responda (en el plan gratuito de Render puede tardar alrededor de un minuto). Si el problema no es de
   conexión sino un error de la app, se muestra de una vez con la causa, y siempre hay un botón para repararla. */
async function repararApp(){
  try{ const rs = await navigator.serviceWorker?.getRegistrations?.() || []; for(const r of rs) await r.unregister(); }catch(e){}
  try{ for(const k of await caches.keys()) await caches.delete(k); }catch(e){}
  location.reload();
}
async function arrancar(){
  const t0=Date.now(); let ultimo='';
  const pantalla=(final)=>{ $('#auth').hidden=false; $('#auth').innerHTML=authCard(`<div class="${final?'warnbox':'okbox'}" style="text-align:center">
    ${final?'':'<div class="spin" aria-hidden="true"></div>'}<b>${final?'No se pudo abrir la app':'Conectando con el servidor…'}</b><br>${final?'':'<span id="desp-t">0</span> s<br>'}
    <small>${final?'':'Si nadie la ha usado en un rato, el servidor tarda alrededor de un minuto en despertar.'}</small>
    <div id="desp-e" style="margin-top:8px;font-weight:400;font-size:13px">${ultimo?esc('Detalle: '+ultimo):''}</div></div>
    <div class="actions" style="justify-content:center;margin-top:10px"><button class="btn primary" onclick="location.reload()">Reintentar</button>
    <button class="btn" onclick="repararApp()">Reparar la app</button></div>
    <p class="hint" style="text-align:center">"Reparar la app" borra la copia guardada en este equipo y descarga la versión actual. No se pierde ningún dato.</p>`); };
  const aviso=setTimeout(()=>{ pantalla(false);
    const it=setInterval(()=>{ const el=$('#desp-t'); if(!el) return clearInterval(it); el.textContent=Math.round((Date.now()-t0)/1000);
      const de=$('#desp-e'); if(de && ultimo) de.textContent='Detalle: '+ultimo; },1000); }, 1500);
  for(;;){
    try{ await entrar(); clearTimeout(aviso); return; }
    catch(e){
      const deRed = e && (e.status >= 500 || /conexión/i.test(e.message||''));
      ultimo = e && e.status ? `el servidor respondió ${e.status}${e.message?' · '+e.message:''}` : (e && e.message) || String(e);
      if(!deRed || Date.now()-t0>150000){ clearTimeout(aviso); pantalla(true); console.error(e); return; }
      await new Promise(r=>setTimeout(r, 3000));
    }
  }
}
arrancar();
</script>
